<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSort AI - Cartón</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3e7d3;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 25px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .logo {
      font-size: 55px;
    }

    h1 {
      margin: 5px 0;
      color: #7b4f25;
      font-size: 28px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 18px;
    }

    #camera {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #222;
      min-height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #camera canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
      background: #8b5e34;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
    }

    #estado {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
    }

    #resultado {
      margin-top: 15px;
      padding: 18px;
      border-radius: 18px;
      background: #f4eadc;
      color: #5c3b1e;
      font-size: 19px;
      font-weight: bold;
      display: none;
    }

    #confianza {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
      font-weight: normal;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">📦</div>

  <h1>EcoSort AI</h1>

  <div class="subtitulo">
    Reconocimiento de residuos — CARTÓN
  </div>

  <div id="camera">
    <span style="color:white;">La cámara aparecerá aquí</span>
  </div>

  <button id="iniciar" onclick="iniciarCamara()">
    📷 Iniciar cámara
  </button>

  <div id="estado">
    Presiona el botón para comenzar.
  </div>

  <div id="resultado"></div>

  <div id="confianza"></div>

</div>

<script>

  // MODELO DE TEACHABLE MACHINE
  const URL = "https://teachablemachine.withgoogle.com/models/y9AIk9YfX/";

  let model;
  let webcam;
  let maxPredictions;

  async function iniciarCamara() {

    const boton = document.getElementById("iniciar");
    const estado = document.getElementById("estado");

    boton.disabled = true;
    estado.innerText = "⏳ Cargando inteligencia artificial...";

    try {

      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);

      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(400, 400, true);

      await webcam.setup({
        facingMode: "environment"
      });

      await webcam.play();

      document.getElementById("camera").innerHTML = "";
      document.getElementById("camera").appendChild(webcam.canvas);

      estado.innerText = "🟢 Cámara activa. Muestra un residuo.";

      window.requestAnimationFrame(loop);

    } catch (error) {

      console.error(error);

      estado.innerText =
        "❌ No se pudo activar la cámara. Revisa los permisos del navegador.";

      boton.disabled = false;
    }
  }


  async function loop() {

    webcam.update();

    await predecir();

    window.requestAnimationFrame(loop);
  }


  async function predecir() {

    const predicciones = await model.predict(webcam.canvas);

    let mayor = predicciones[0];

    for (let i = 1; i < predicciones.length; i++) {

      if (predicciones[i].probability > mayor.probability) {
        mayor = predicciones[i];
      }

    }

    const clase = mayor.className.toLowerCase();
    const porcentaje = (mayor.probability * 100).toFixed(1);

    const resultado = document.getElementById("resultado");
    const confianza = document.getElementById("confianza");

    confianza.innerText =
      "Confianza de reconocimiento: " + porcentaje + "%";


    // CARTÓN
    if (
      clase.includes("carton") ||
      clase.includes("cartón") ||
      clase.includes("papel")
    ) {

      resultado.style.display = "block";

      resultado.innerHTML =
        "✅ ¡ES CARTÓN!<br><br>" +
        "📦 Deposítalo en el<br>" +
        "🟤 TACHO DE CARTÓN.";
    }


    // PLÁSTICO
    else if (clase.includes("plastico") || clase.includes("plástico")) {

      resultado.style.display = "block";

      resultado.innerHTML =
        "❌ NO VA AQUÍ<br><br>" +
        "🧴 Este residuo es PLÁSTICO.<br>" +
        "➡️ Llévalo al TACHO DE PLÁSTICO.";
    }


    // ORGÁNICO
    else if (clase.includes("organico") || clase.includes("orgánico")) {

      resultado.style.display = "block";

      resultado.innerHTML =
        "❌ NO VA AQUÍ<br><br>" +
        "🍎 Este residuo es ORGÁNICO.<br>" +
        "➡️ Llévalo al TACHO DE ORGÁNICO.";
    }


    // OTRO RESULTADO
    else {

      resultado.style.display = "block";

      resultado.innerHTML =
        "🔎 Residuo detectado:<br><br>" +
        mayor.className;
    }
  }

</script>

</body>
</html>
