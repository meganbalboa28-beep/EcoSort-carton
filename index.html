<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSort AI - Cartón</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4eadc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 5px 0;
      color: #8b5a2b;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .camera {
      border: 3px dashed #c49a6c;
      border-radius: 18px;
      padding: 25px 15px;
      margin-bottom: 20px;
      background: #fffaf4;
    }

    .camera-icon {
      font-size: 45px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #9b6b3d;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #f1e2cf;
      color: #5d3a1a;
      font-size: 18px;
      font-weight: bold;
    }

    .examples {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="icon">📦</div>

    <h1>EcoSort AI</h1>

    <div class="subtitle">
      Detector de residuos de cartón
    </div>

    <div class="camera">
      <div class="camera-icon">📷</div>
      <p>Coloca el residuo frente a la cámara</p>
      <button onclick="reconocer()">Reconocer residuo</button>
    </div>

    <div id="resultado" class="result"></div>

    <div class="examples">
      Ejemplos: 📦 caja de cartón · 📄 papel · 🥡 cartón de alimentos
    </div>

  </div>

  <script>
    function reconocer() {

      const resultado = document.getElementById("resultado");

      resultado.style.display = "block";

      resultado.innerHTML =
        "✅ ¡Residuo identificado!<br><br>" +
        "📦 Este residuo pertenece al<br>" +
        "🟤 TACHO DE CARTÓN.";
    }
  </script>

</body>
</html>
